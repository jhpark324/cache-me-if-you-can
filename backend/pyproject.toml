[project]
name = "cache-me"
version = "0.5.0"
description = "Local knowledge workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "platformdirs>=4,<5",
  "filelock>=3,<5",
  "mcp==2.3.0",
  "langgraph>=1,<2",
  "langchain==1.4.7",
  "lancedb==0.41.0",
  "markdown-it-py>=4,<5",

]

[project.scripts]
cache-me = "cache_me.main:run"

[project.optional-dependencies]
embedding = ["sentence-transformers==6.2.0", "transformers==5.22.1", "torch==2.15.0", "huggingface-hub>=2,<3"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_me"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "cache_me/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]
