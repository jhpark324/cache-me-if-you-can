name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.30"
          python-version: "3.12"
      - name: Install locked quality tools and backend dependencies
        run: uv sync --locked --group quality
      - name: Ruff correctness checks
        run: uv run --locked --group quality ruff check --config pyproject.toml src tests scripts alembic ../scripts
      - name: Mypy configuration and API/MCP contracts
        run: uv run --locked --group quality mypy

  backend-tests:
    name: Backend tests and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.30"
          python-version: "3.12"
      - name: Install locked test dependencies
        run: uv sync --locked --group quality --extra test
      - name: Run backend tests and report coverage
        run: |
          uv run --locked --group quality --extra test pytest -q --cov --cov-report=term \
            --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
