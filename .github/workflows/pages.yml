name: Project showcase

on:
  pull_request:
    paths:
      - 'docs/showcase/**'
      - 'frontend/scripts/*showcase*.mjs'
      - 'frontend/package*.json'
      - 'scripts/build_showcase.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/showcase/**'
      - 'frontend/scripts/*showcase*.mjs'
      - 'frontend/package*.json'
      - 'scripts/build_showcase.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked build dependencies
        run: npm --prefix frontend ci
      - name: Render static showcase and check links, videos and captions
        run: python3 scripts/build_showcase.py "$RUNNER_TEMP/showcase"
      - name: Check Astryx in the published files
        working-directory: frontend
        run: npx --no-install astryx doctor --built "$RUNNER_TEMP/showcase"
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/showcase

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
