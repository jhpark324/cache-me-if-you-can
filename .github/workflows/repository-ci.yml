name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository preflight and script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.30"
          python-version: "3.12"
      - name: Check publication candidates and document links
        run: uv run --no-project --python 3.12 python scripts/preflight.py
      - name: Run repository script tests
        run: uv run --no-project --python 3.12 python -m unittest discover -s scripts/tests -v
