name: Check source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.30"
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check publication candidates and document links
        run: |
          uv run --no-project --python 3.12 python scripts/preflight.py
          uv run --no-project --python 3.12 python -m unittest discover -s scripts/tests -v
      - name: Install locked backend (no model download)
        run: uv sync --locked --project backend --extra test
      - name: Backend contracts and fake-provider regressions
        run: uv run --locked --project backend --extra test pytest backend/tests -q
      - name: Build web and run browser fixtures
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test

# Live account login, real Codex confirmation, KURE model and native OS gates
# remain explicit checks documented in docs/guides/repository-readiness.md.
