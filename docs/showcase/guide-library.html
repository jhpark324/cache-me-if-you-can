<!doctype html>
<html lang="ko" data-astryx-theme="cache-me" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Cache Me If You Can의 기능 명세, 시스템 설계와 기술 결정 문서를 주제나 용어로 찾습니다.">
  <title>명세와 설계 원문 · Cache Me If You Can</title>
  <link rel="stylesheet" href="astryx.css">
  <link rel="stylesheet" href="guide.css">
  <link rel="stylesheet" href="reference.css">
  <script src="library-search.js" defer></script>
</head>
<body>
  <a class="g-skip" href="#main">본문으로 건너뛰기</a>
  <header class="g-header"></header>
  <main id="main" class="g-wrap g-main ref-library" tabindex="-1">
    <header class="g-intro">
      <h1>명세와 설계 원문</h1>
      <p class="g-lead">구성요소와 데이터 흐름은 시스템 설계에서, 제품이 지켜야 할 조건은 기능 명세에서, 기술을 선택한 이유는 결정 기록에서 읽을 수 있습니다.</p>
    </header>
    <form id="ref-search" class="ref-search" role="search" hidden>
      <label for="ref-query">문서와 본문 찾기</label>
      <div><input type="search" name="q" id="ref-query" placeholder="출처, 수정 충돌, LanceDB" autocomplete="off"><button type="submit">찾기</button></div>
    </form>
    <p id="ref-count" role="status" aria-live="polite"></p>
    <section id="ref-results" class="ref-results" aria-label="일치하는 문서와 절" hidden></section>
    <div id="ref-catalog"></div>
  </main>
</body>
</html>
